spring.application.name=statement-service
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]
server.port=${STATEMENT_SERVICE_PORT:8087}

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/statement_db
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

clients.policy-url=${POLICY_SERVICE_URL:http://policy-service}
clients.premium-url=${PREMIUM_SERVICE_URL:http://premium-service}
clients.claims-url=${CLAIMS_SERVICE_URL:http://claims-service}

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/}
eureka.client.healthcheck.enabled=true
eureka.client.refresh.enable=false
eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.value}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:false}
spring.cloud.loadbalancer.cache.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.swagger-ui.path=/swagger-ui.html
