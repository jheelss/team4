spring.application.name=statement-service
server.port=8087
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/statement_db
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
clients.policy-url=http://localhost:8084
clients.premium-url=http://localhost:8085
clients.claims-url=http://localhost:8086
springdoc.swagger-ui.path=/swagger-ui.html
