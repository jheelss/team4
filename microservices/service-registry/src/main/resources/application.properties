spring.application.name=service-registry
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]
server.port=${EUREKA_PORT:8761}
server.address=${EUREKA_BIND_ADDRESS:127.0.0.1}

eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:${server.port}/eureka/
eureka.server.default-open-for-traffic-count=0
eureka.server.enable-self-preservation=${EUREKA_SELF_PRESERVATION:true}

eureka.security.username=${EUREKA_USERNAME}
eureka.security.password=${EUREKA_PASSWORD}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
info.app.name=SecureLife service registry
