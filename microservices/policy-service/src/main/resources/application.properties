spring.application.name=policy-service
server.port=8084
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/policy_db
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
clients.policyholder-url=http://localhost:8082
clients.product-url=http://localhost:8083
springdoc.swagger-ui.path=/swagger-ui.html
