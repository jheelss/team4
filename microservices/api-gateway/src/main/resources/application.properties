spring.application.name=api-gateway
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]
server.port=${API_GATEWAY_PORT:8080}

security.jwt-secret=${JWT_SECRET}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.swagger-ui.path=/swagger-ui.html

# Comma-separated browser origins permitted to use this gateway.
frontend.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost:8000,http://127.0.0.1:8000}
