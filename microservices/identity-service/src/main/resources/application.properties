spring.application.name=identity-service
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]
server.port=${IDENTITY_SERVICE_PORT:8081}

spring.datasource.url=${IDENTITY_DB_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/identity_db}
spring.datasource.username=${IDENTITY_DB_USERNAME:${MYSQL_USER}}
spring.datasource.password=${IDENTITY_DB_PASSWORD:${MYSQL_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

security.jwt-secret=${JWT_SECRET}

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/}
eureka.client.healthcheck.enabled=true
eureka.client.refresh.enable=false
eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.value}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:false}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.swagger-ui.path=/swagger-ui.html
